name: Diag Admin Login

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Diagnose containers + admin users + recent auth
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s << 'REMOTE'
          set -euo pipefail
          echo "===== HOST / TIME ====="
          hostname
          date -u

          echo "===== DOCKER PS (clube) ====="
          cd /opt/clube-geek-toys/server
          docker compose ps || docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

          echo "===== API HEALTH (internal) ====="
          docker exec clube-geek-api wget -qO- http://localhost:3001/health || true

          echo "===== ADMIN / SELLER USERS (no secrets) ====="
          docker exec clube-geek-postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c \
            "SELECT id, email, role, email_verified, created_at,\n                    (refresh_token_hash IS NOT NULL) AS has_refresh,\n                    length(password_hash) AS pw_hash_len\n             FROM users\n             WHERE role IN ('admin','seller','disabled')\n             ORDER BY role, email;" \
            2>/dev/null || \
          docker exec clube-geek-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT id, email, role, email_verified, created_at, (refresh_token_hash IS NOT NULL) AS has_refresh, length(password_hash) AS pw_hash_len FROM users WHERE role IN (\"admin\",\"seller\",\"disabled\") ORDER BY role, email;"' 2>/dev/null || \
          docker exec clube-geek-postgres sh -c 'source /dev/null; env | grep -i POSTGRES || true; ls /; psql --help | head -2'

          # Prefer reading env from compose container
          echo "===== USERS VIA API CONTAINER ENV ====="
          docker exec clube-geek-api sh -c '
            node -e "
              const {Client}=require(\"pg\");
              const c=new Client({connectionString:process.env.DATABASE_URL});
              (async()=>{
                await c.connect();
                const r=await c.query(\"`SELECT email, role, email_verified, created_at, (refresh_token_hash IS NOT NULL) AS has_refresh, length(password_hash) AS pw_hash_len FROM users WHERE role IN (\'admin\',\'seller\',\'disabled\') ORDER BY role, email`\");
                console.table(r.rows);
                const a=await c.query(\"`SELECT action, user_id, details, created_at FROM audit_logs WHERE action LIKE \'auth.%\' ORDER BY created_at DESC LIMIT 20`\");
                console.log(\"===== RECENT AUTH AUDIT =====\");
                console.table(a.rows);
                const t=await c.query(\"`SELECT count(*)::int AS total_users, count(*) FILTER (WHERE role=\'admin\')::int AS admins, count(*) FILTER (WHERE role=\'seller\')::int AS sellers, count(*) FILTER (WHERE role=\'member\')::int AS members, count(*) FILTER (WHERE role=\'disabled\')::int AS disabled FROM users`\");
                console.log(\"===== USER COUNTS =====\");
                console.table(t.rows);
                await c.end();
              })().catch(e=>{console.error(e); process.exit(1);});
            "
          ' || echo "node/pg probe failed"

          echo "===== API LOGS (last 80 lines, auth-ish) ====="
          docker logs clube-geek-api --tail 200 2>&1 | grep -iE 'auth|login|error|CORS|JWT|401|403|rate' | tail -80 || docker logs clube-geek-api --tail 40 2>&1 || true

          echo "===== ENV KEYS (names only) ====="
          docker exec clube-geek-api sh -c 'env | cut -d= -f1 | sort'

          echo "===== FRONTEND_URL / API_URL ====="
          docker exec clube-geek-api sh -c 'echo FRONTEND_URL=$FRONTEND_URL; echo API_URL=$API_URL; echo NODE_ENV=$NODE_ENV; echo ADMIN_EMAIL=$ADMIN_EMAIL'

          echo "===== DONE ====="
          REMOTE
