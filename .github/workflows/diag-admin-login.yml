name: Diag Admin Login

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run VPS diagnostics
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          echo "===== HOST / TIME ====="
          hostname; date -u

          echo "===== DOCKER PS ====="
          cd /opt/clube-geek-toys/server
          docker compose ps || true

          echo "===== API HEALTH ====="
          docker exec clube-geek-api wget -qO- http://localhost:3001/health || true
          echo

          echo "===== ENV ====="
          docker exec clube-geek-api sh -c 'printf "FRONTEND_URL=%s\nAPI_URL=%s\nNODE_ENV=%s\nADMIN_EMAIL=%s\n" "$FRONTEND_URL" "$API_URL" "$NODE_ENV" "$ADMIN_EMAIL"'

          echo "===== STAFF USERS ====="
          docker exec clube-geek-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "
            SELECT email, role, email_verified, created_at,
                   (refresh_token_hash IS NOT NULL) AS has_refresh,
                   length(password_hash) AS pw_hash_len
            FROM users
            WHERE role IN ('\''admin'\'','\''seller'\'','\''disabled'\'');
          "'

          echo "===== USER COUNTS ====="
          docker exec clube-geek-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "
            SELECT count(*)::int AS total,
                   count(*) FILTER (WHERE role = '\''admin'\'\'')::int AS admins,
                   count(*) FILTER (WHERE role = '\''seller'\'\'')::int AS sellers,
                   count(*) FILTER (WHERE role = '\''member'\'\'')::int AS members,
                   count(*) FILTER (WHERE role = '\''disabled'\'\'')::int AS disabled
            FROM users;
          "'

          echo "===== KNOWN EMAILS ====="
          docker exec clube-geek-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "
            SELECT email, role, email_verified
            FROM users
            WHERE email IN ('\''geeketoys@gmail.com'\'','\''claude-e2e@geeketoys.com.br'\'','\''admin@geeketoys.com.br'\'','\''leoschlanger@gmail.com'\'');
          "'

          echo "===== AUTH AUDIT (last 25) ====="
          docker exec clube-geek-postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -c "
            SELECT action, user_id, details, created_at
            FROM audit_logs
            WHERE action LIKE '\''auth.%'\'\''
            ORDER BY created_at DESC
            LIMIT 25;
          "' || echo "(audit_logs query failed — table may differ)"

          echo "===== API LOGS (filtered) ====="
          docker logs clube-geek-api --tail 300 2>&1 | grep -iE 'auth|login|error|CORS|JWT|401|403|rate|Invalid env' | tail -80 || true

          echo "===== DONE ====="
          REMOTE
