name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Roda antes do build para o erro de tipo aparecer sozinho, e não
      # misturado à saída do bundler. Cobre `src/` sem os testes — a checagem dos
      # testes é `npm run typecheck` (ver tsconfig.app.json).
      - name: Typecheck
        run: npx tsc -b

      # `tsc -b` resolves tsconfig.json → tsconfig.app.json, whose `include` is
      # `src` only: the entire backend went unchecked here and a type error in
      # it surfaced mid-deploy, inside `docker compose build --no-cache`, with
      # the rsync already done. Seconds here, a broken deploy there.
      #
      # The backend has its own package.json, so the root `npm ci` leaves it
      # without node_modules — without this install the check fails on
      # "Cannot find module 'pg'" rather than on anything real.
      - name: Install backend dependencies
        run: npm ci --prefix server/api

      - name: Typecheck backend
        run: npm --prefix server/api run build

      # The deploy ran 2.278 tests' worth of nothing: no test step existed, so
      # the only automatic barrier between a commit and production was the type
      # checker. `test:api` is the cheap half (~40s, no jsdom) and covers the
      # code that moves money. `test:web` stays out — it is the slow one and
      # belongs in a separate job.
      - name: API tests
        run: npm run test:api

      - name: Lint
        run: npm run lint

      - name: Build frontend
        env:
          VITE_API_URL: https://api.geeketoys.com.br
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_PIX_KEY: ${{ secrets.VITE_PIX_KEY }}
          VITE_ENVIRONMENT: production
        run: npx vite build --mode production

      # Secrets used here (from repo docs/DEPLOY.md + CLAUDE.local.md — not invented):
      #   VPS_HOST, VPS_USER, VPS_SSH_KEY
      # Keep key write as plain echo — that is what succeeded on recent deploys.
      # Do NOT fail the job if ssh-keyscan flakes; accept-new covers first connect.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # OpenSSH requires a trailing newline on private keys
          [ -n "$(tail -c1 ~/.ssh/deploy_key)" ] && echo >> ~/.ssh/deploy_key
          # Best-effort host keys (network flakes on runners are common)
          for i in 1 2 3; do
            ssh-keyscan -T 20 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          # Fallback so rsync/ssh still work if keyscan got nothing
          printf '%s\n' \
            'Host *' \
            '  StrictHostKeyChecking accept-new' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            '  IdentityFile ~/.ssh/deploy_key' \
            '  IdentitiesOnly yes' \
            '  ServerAliveInterval 15' \
            > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # Sanity: key file non-empty (do not print key material)
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "ERROR: VPS_SSH_KEY secret produced an empty key file"
            exit 1
          fi
          echo "SSH key file ready ($(wc -c < ~/.ssh/deploy_key) bytes), known_hosts lines=$(wc -l < ~/.ssh/known_hosts)"

      - name: Deploy server files
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            server/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/clube-geek-toys/server/
          # rsync copies git file mode. Scripts used to be 100644 in git, so
          # cron (`/path/script.sh`) got "Permission denied" after every deploy.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'chmod 755 /opt/clube-geek-toys/server/scripts/*.sh'

      - name: Deploy frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/clube-geek-toys/dist/

      - name: Rebuild and restart containers
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY'
            cd /opt/clube-geek-toys/server
            docker compose build --no-cache api
            docker compose up -d --force-recreate api nginx
            # certbot renova o cert de TODOS os domínios; ele ficou parado 3
            # semanas sem ninguém notar porque o deploy só recriava api+nginx.
            # Sem --force-recreate: se já está de pé, não mexe.
            docker compose up -d certbot
            sleep 3
            docker ps --format 'table {{.Names}}\t{{.Status}}'
            # build --no-cache acumula camadas a cada deploy (24 GB em 15/08/2026).
            # Roda DEPOIS do up: as imagens em uso não são tocadas, só o cache de
            # build órfão. `|| true` porque limpeza não pode derrubar o deploy.
            docker builder prune -af --filter 'until=24h' || true
            df -h / | tail -1
            echo "Deploy completed at $(date)"
          DEPLOY

      - name: Health check
        run: |
          # Hit the API via its public domain (cert SAN covers it);
          # VPS_HOST is an IP for SSH, which has no matching cert.
          #
          # Espera o `ensureSchema()` terminar antes de julgar: ele roda depois do
          # listen(), então logo após o boot `schema.status` ainda é `pending`.
          # `run:` roda sob `bash -e`, então nada aqui pode devolver != 0 por
          # acidente: `|| true` nos curl/jq, e `if` em vez de `cond && break`.
          BODY=""
          SCHEMA="pending"
          for i in $(seq 1 10); do
            sleep 3
            BODY=$(curl -sf --max-time 10 https://api.geeketoys.com.br/health) || BODY=""
            [ -n "$BODY" ] || continue
            SCHEMA=$(echo "$BODY" | jq -r '.schema.status // "pending"' 2>/dev/null || echo pending)
            if [ "$SCHEMA" != "pending" ]; then
              break
            fi
          done

          if [ -z "$BODY" ]; then
            echo "Health check FAILED: /health não respondeu em 10 tentativas"
            exit 1
          fi

          echo "$BODY" | jq . || echo "$BODY"
          STATUS=$(echo "$BODY" | jq -r '.status' 2>/dev/null || echo unknown)

          if [ "$SCHEMA" = "degraded" ]; then
            # Migration quebrada no boot. A API serve tráfego, mas com schema
            # incompleto — o deploy não pode passar em verde por cima disso.
            FAILED=$(echo "$BODY" | jq -r '.schema.failedSteps')
            echo "Health check FAILED: schema DEGRADADO ($FAILED etapa(s))."
            echo "Detalhe por etapa: docker compose logs api | grep SCHEMA"
            exit 1
          fi

          if [ "$STATUS" = "ok" ]; then
            echo "Health check passed!"
          else
            echo "Health check FAILED!"
            exit 1
          fi
