# Weekly, grouped: one PR per ecosystem per week instead of one per package.
# Security updates are not grouped — GitHub opens those at once, on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime: the API runs Node 24 (server/api/Dockerfile).
      # Move both together when the runtime changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only; TypeScript 7 breaks
      # the type-aware lint. Revisit when typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react-hooks 7.1 turns 26 working effects (checkout, payment,
      # signup) into lint errors, and ESLint 10 needs 7.1. Both wait for that
      # refactor, which is its own change; see docs/TODO.md.
      - dependency-name: eslint-plugin-react-hooks
        versions: ['>=7.1.0']
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /server/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stripe is legacy (refunds of charges before 2026-09-01). A major bump
      # moves every call to a newer Stripe API version, which no test can
      # check without refunding real money. Stay on 22 until Stripe is removed.
      - dependency-name: stripe
        update-types: [version-update:semver-major]
      # Types follow the runtime: the API runs Node 24 (server/api/Dockerfile).
      # Move both together when the runtime changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only; TypeScript 7 breaks
      # the type-aware lint. Revisit when typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
