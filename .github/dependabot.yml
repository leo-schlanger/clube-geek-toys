# Weekly, grouped: one PR per ecosystem per week instead of one per package.
# Security updates are not grouped — GitHub opens those at once, on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime: the API runs Node 24 (server/api/Dockerfile).
      # Move both together when the runtime changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only; TypeScript 7 breaks
      # the type-aware lint. Revisit when typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /server/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime: the API runs Node 24 (server/api/Dockerfile).
      # Move both together when the runtime changes.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only; TypeScript 7 breaks
      # the type-aware lint. Revisit when typescript-eslint widens its peer range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
