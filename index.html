<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Primary Meta Tags -->
    <title>Clube GeekPop & Toys — 10% de Desconto em Qualquer Produto</title>
    <meta name="title" content="Clube GeekPop & Toys — 10% de Desconto em Qualquer Produto" />
    <meta name="description" content="Clube GeekPop &amp; Toys: plano anual de R$ 159,90 com 10% de desconto em qualquer produto, 50% nos ingressos dos eventos e brinde na primeira compra." />
    <meta name="keywords" content="clube geek, geekpop, k-pop, descontos, clube de vantagens, geek toys, colecionáveis, action figures, funko pop, brinquedos, copacabana geek, loja k-pop" />
    <meta name="author" content="LNA GEEK POP COMERCIO DE ARTIGOS EM GERAL LTDA" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://club.geekpoptoys.com.br/assinar" />
    <meta property="og:site_name" content="Clube GeekPop & Toys" />
    <meta property="og:title" content="Clube GeekPop & Toys — Seu Universo Geek com Vantagens" />
    <meta property="og:description" content="Plano anual de R$ 159,90: 10% de desconto em qualquer produto (loja física e online), 50% nos ingressos dos eventos e brinde na primeira compra da loja." />
    <meta property="og:image" content="https://club.geekpoptoys.com.br/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clube GeekPop & Toys — Descontos exclusivos em colecionáveis geek" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://club.geekpoptoys.com.br/assinar" />
    <meta name="twitter:title" content="Clube GeekPop & Toys — 10% em Qualquer Produto" />
    <meta name="twitter:description" content="Plano anual de R$ 159,90 com 10% de desconto em qualquer produto, 50% nos ingressos dos eventos e brinde na primeira compra. Carteirinha digital." />
    <meta name="twitter:image" content="https://club.geekpoptoys.com.br/og-image.png" />
    <meta name="twitter:image:alt" content="Clube GeekPop & Toys" />

    <!-- As tags acima vêm antes de qualquer script ou comentário longo de
         propósito: leitor de preview (WhatsApp) lê só o começo da página e
         desiste se não achar og:image cedo. Não mova nada para cima delas. -->

    <!-- Anti-FOUC + loader inicial. Externo (e não inline) porque o CSP das SPAs
         não permite script inline — ver public/boot.js. Sem defer/async: precisa
         aplicar o tema antes da primeira pintura. -->
    <script src="/boot.js"></script>

    <!--
      Tab icon is the GeekPop & Toys wordmark, not a letterform. The previous
      favicon.svg drew a generic pink "G" that belonged to no brand asset.
      The .ico carries 16/32/48/64 so the browser downsamples from the right
      source instead of squashing a 512px plate.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#F04080" />
    <meta name="msapplication-TileColor" content="#F04080" />

    <!-- JSON-LD do clube (Organization, Product, FAQPage) sai do SeoHead do
         /assinar (src/lib/club-structured-data.ts): aqui ia para toda rota do
         clube e para o painel. -->

    <!-- Analytics: loaded dynamically AFTER cookie consent (see src/lib/analytics.ts).
         Removed from index.html to comply with LGPD Art. 7º — no tracking before consent. -->

    <!-- Cloudflare Turnstile (CAPTCHA) — loaded async, only used on registration -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

    <!-- DNS Prefetch / Preconnect -->
    <link rel="dns-prefetch" href="https://api.geeketoys.com.br" />
    <link rel="preconnect" href="https://api.geeketoys.com.br" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Preload hero logo -->
    <link rel="preload" as="image" href="/logo-vip-160.webp" type="image/webp" />
  </head>
  <body>
    <div id="root">
      <!-- Inline loading state -->
      <div id="initial-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--boot-bg,#FDFBFC);font-family:Inter,sans-serif;">
        <div style="text-align:center;">
          <img src="/logo-vip-160.webp" alt="Clube GeekPop & Toys" style="height:80px;margin-bottom:16px;" width="80" height="80" />
          <div style="color:var(--boot-pink,#F04080);font-size:14px;font-weight:600;">Carregando...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
