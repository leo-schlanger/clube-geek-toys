# /etc/systemd/journald.conf.d/clube.conf
#
# The API and nginx log to journald (docker-compose.yml, `driver: journald`) so
# their history survives the deploy that recreates the containers. Thirty days
# of it, capped at 2 GB — the disk has 80+ GB free and a week was too short to
# investigate anything reported on a Monday about the week before.
#
# Install: cp ops/journald/clube.conf /etc/systemd/journald.conf.d/ && systemctl restart systemd-journald
[Journal]
SystemMaxUse=2G
MaxRetentionSec=30day
