# Ban scanners for a day after 3 probes in 10 minutes.
#
# nginx runs in Docker and logs to journald (CONTAINER_NAME=clube-geek-nginx).
# The ban goes in DOCKER-USER, not INPUT: traffic to published container ports
# is DNAT'ed before INPUT, so the default action would ban nothing.
#
# Install:
#   cp ops/fail2ban/filter.d/clube-nginx-scan.conf /etc/fail2ban/filter.d/
#   cp ops/fail2ban/jail.d/clube-nginx-scan.conf  /etc/fail2ban/jail.d/
#   fail2ban-client reload && fail2ban-client status clube-nginx-scan
[clube-nginx-scan]
enabled   = true
backend   = systemd
journalmatch = CONTAINER_NAME=clube-geek-nginx
filter    = clube-nginx-scan
maxretry  = 3
findtime  = 10m
bantime   = 1d
action    = iptables-multiport[name=clube-scan, port="http,https", protocol=tcp, chain="DOCKER-USER"]
