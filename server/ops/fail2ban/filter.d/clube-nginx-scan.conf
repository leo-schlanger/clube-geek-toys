# Vulnerability scanners: paths that do not exist anywhere in this stack.
#
# The shop, club, admin and API are Node + static files — no PHP, no .env on
# the web root, no WordPress — so a request for one of these is a bot probing
# for a hole, never a customer. The radio (AzuraCast) IS PHP, so its host is
# excluded. Any status counts: the SPA hosts answer 200 to every path (they
# fall back to index.html), so requiring a 404 caught nothing there.
# Reads the JSON access log (server/nginx/nginx.conf, `log_format
# json`); the field order there is what this regex relies on.
[Definition]
failregex = ^\{"time":"[^"]*","reqId":"[^"]*","ip":"<HOST>","host":"(?!radio\.)[^"]*","method":"[A-Z]+","path":"[^"]*(?:\.php|/\.env|/\.git/|/wp-admin|/wp-login|/wp-content|/wp-includes|/phpmyadmin|/cgi-bin/|/\.aws/|/\.ssh/|/vendor/phpunit|/actuator|/server-status)[^"]*","status":\d+
ignoreregex =
