# Security headers
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ─── Content-Security-Policy (club / shop / adm) ──────────────────────────────
#
# É aqui que o JWT vive (localStorage), então o que mais importa é connect-src:
# mesmo que alguém consiga injetar script, o token não sai para um host de fora.
#
# Sem 'unsafe-inline' em script-src — por isso o boot da SPA saiu do index.html
# para /boot.js. Os blocos <script type="application/ld+json"> continuam inline e
# NÃO são bloqueados: verificado no navegador contra a produção em 15/08/2026.
# Sem 'unsafe-eval': o zod sonda `new Function("")` dentro de try/catch e cai no
# caminho alternativo sozinho — validação do cadastro conferida com o CSP ligado.
#
# Cada host da lista foi tirado do código, não chutado:
#   js.stripe.com / api.stripe.com     checkout
#   challenges.cloudflare.com          Turnstile (captcha do cadastro)
#   analytics.*                        Umami, injetado após consentimento
#   radio.*                            now-playing + stream mp3
#   fonts.googleapis / gstatic         Outfit + Inter
#   brasilapi / dns.google / ipify     validação de CPF, MX e IP de assinatura
#   youtube-nocookie / instagram       embeds de vídeo do produto
# Ao adicionar integração nova, rode scripts/qa/csp-probe.mjs antes de subir.
set $csp_spa "default-src 'self'; script-src 'self' https://js.stripe.com https://challenges.cloudflare.com https://analytics.geeketoys.com.br https://analytics.geekpoptoys.com.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://radio.geeketoys.com.br https://api.geeketoys.com.br https://api.geekpoptoys.com.br; connect-src 'self' https://api.geeketoys.com.br https://api.geekpoptoys.com.br https://analytics.geeketoys.com.br https://analytics.geekpoptoys.com.br https://radio.geeketoys.com.br https://api.stripe.com https://challenges.cloudflare.com https://brasilapi.com.br https://dns.google https://api.ipify.org; frame-src https://js.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";
add_header Content-Security-Policy $csp_spa always;

# /boot.js não tem hash no nome (vem de public/), então não pode entrar na regra
# immutable de 1 ano abaixo — ficaria congelado no navegador para sempre.
# `location =` tem prioridade sobre regex, então este bloco vence.
location = /boot.js {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Content-Security-Policy $csp_spa always;
    add_header X-Content-Type-Options nosniff always;
}

# Cache static assets
location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
