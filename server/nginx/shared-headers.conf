# ─── Cache padrão: nada de HTML velho ─────────────────────────────────────────
#
# Vale para tudo que NÃO tem `add_header` próprio — na prática, o shell da SPA
# (index.html / shop.html). Nome fixo, conteúdo novo a cada deploy, e é ele que
# aponta para os chunks com hash. O deploy roda `rsync --delete`, então os chunks
# do build anterior somem do servidor: um navegador que reusa um index.html velho
# pede um arquivo que virou 404 e o `import()` da aba estoura
# "Failed to fetch dynamically imported module" — o painel inteiro cai na tela de
# erro. Antes daqui o nginx não mandava Cache-Control nenhum no HTML, e no bloco
# do adm o sub_filter ainda remove ETag/Last-Modified: não sobrava nem validador.
#
# Declarado no nível do server, e não num `location ~ \.html$`, de propósito:
# `add_header` num location SUBSTITUI o conjunto herdado, e um bloco só para o
# HTML derrubaria X-Frame-Options, HSTS e o X-Robots-Tag do painel justamente na
# resposta que mais precisa deles. Os blocos de asset abaixo já declaram o
# Cache-Control `immutable` deles, então continuam com cache longo.
add_header Cache-Control "no-cache, must-revalidate" always;

# O shell saía como `Content-Type: text/html`, sem charset. O navegador acha o
# <meta charset>, mas leitor de preview que não o procura cai em Latin-1.
charset utf-8;

# Security headers
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
# "0" is the current OWASP advice: the old XSS auditor is gone from browsers,
# and where it survived it could be abused to blank out parts of a page.
add_header X-XSS-Protection "0" always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(self), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ─── Content-Security-Policy (club / shop / adm) ──────────────────────────────
# O valor e a lista de hosts ficam no `map $csp_spa` do nginx.conf (nível http):
# com `set` aqui, pedido recusado antes da fase de rewrite (400, linha inválida)
# saía sem CSP e logava "using uninitialized csp_spa variable".
add_header Content-Security-Policy $csp_spa always;

# Arquivos sem hash no nome não podem entrar na regra immutable de 1 ano abaixo:
# como o nome nunca muda, o navegador ficaria com a versão antiga para sempre.
# `location =` tem prioridade sobre regex, então estes blocos vencem.
location = /boot.js {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header Content-Security-Policy $csp_spa always;
    add_header X-Content-Type-Options nosniff always;
}

# O service worker é o pior caso: é o arquivo que o navegador consulta para
# descobrir que existe versão nova. Servido como immutable por um ano, ele
# mantinha o SW antigo — que por sua vez servia os bundles antigos do próprio
# precache — e **todo deploy ficava invisível para quem já tinha visitado**.
# Foi assim que a política de privacidade continuou mostrando a data antiga
# depois de atualizada e publicada.
location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Content-Security-Policy $csp_spa always;
    add_header X-Content-Type-Options nosniff always;
}

location = /registerSW.js {
    add_header Cache-Control "no-cache, must-revalidate";
    add_header Content-Security-Policy $csp_spa always;
    add_header X-Content-Type-Options nosniff always;
}

# Sem hash e lido a cada instalação/atualização do PWA.
location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Content-Type-Options nosniff always;
}

# Cache static assets
location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}

location ~* \.(jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
