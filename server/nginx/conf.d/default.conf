# ============================================
# HTTP → HTTPS redirect + ACME challenge
# ============================================
server {
    listen 80;
    server_name club.geeketoys.com.br admin.geeketoys.com.br adm.geeketoys.com.br shop.geeketoys.com.br api.geeketoys.com.br analytics.geeketoys.com.br radio.geeketoys.com.br
                club.geekpoptoys.com.br admin.geekpoptoys.com.br adm.geekpoptoys.com.br shop.geekpoptoys.com.br api.geekpoptoys.com.br analytics.geekpoptoys.com.br radio.geekpoptoys.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all for IP access (HTTP)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        client_max_body_size 120m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================
# club.geeketoys.com.br — Member SPA
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name club.geeketoys.com.br club.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/shared-headers.conf;
}

# ============================================
# shop.geeketoys.com.br — Loja e-commerce (same cert, same build)
# Mesmo bundle Vite; getAppMode() detecta o subdomínio 'shop' em runtime.
# Fala com a API em api.geeketoys.com.br (imagens de produto em /uploads/ lá).
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name shop.geeketoys.com.br shop.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    # Shell própria da loja: <head> com meta e JSON-LD de e-commerce.
    # Substitui as regras de sub_filter que reescreviam o HTML do clube —
    # aquilo deixava og:description com o pitch do plano, quebrava a
    # description no meio da frase e não tocava em nenhum JSON-LD, então a
    # loja se declarava ao Google como a assinatura de R$ 149,99.
    index shop.html;

    # Dynamic product sitemap from API (active catalog)
    location = /sitemap-products.xml {
        proxy_pass http://api:3001/products/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preview de link de produto: WhatsApp e afins recebem HTML com a foto e o
    # preço da peça; pessoa segue para a SPA normalmente.
    location ~ ^/produto/ {
        if ($is_link_crawler) {
            rewrite ^/produto/(.+?)/?$ /__share/$1 last;
        }
        # Fallback da loja é shop.html — /index.html sozinho devolveria o <head>
        # do clube para toda rota da SPA, que é o que se quer evitar. Ele fica
        # por último só como rede de segurança: se um deploy não levar
        # shop.html, a loja degrada para o shell do clube em vez de dar 404.
        try_files $uri $uri/ /shop.html /index.html;
    }

    location ~ ^/__share/(?<share_slug>.+)$ {
        internal;
        proxy_pass http://api:3001/products/$share_slug/share;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # /index.html no fim é rede de segurança: se um deploy não levar
        # shop.html, a loja degrada para o shell do clube em vez de dar 404.
        try_files $uri $uri/ /shop.html /index.html;
    }

    include /etc/nginx/shared-headers.conf;
}

# ============================================
# admin.* → adm.* (canônico)
# Motivo: alguns filtros/adblock e bookmarks quebram em subdomínio "admin";
# "adm" é o host canônico do painel. Mantém path/query no redirect.
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.geeketoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://adm.geeketoys.com.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://adm.geekpoptoys.com.br$request_uri;
}

# ============================================
# adm — Admin SPA (same cert, same build)
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name adm.geeketoys.com.br adm.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Painel administrativo não entra em buscador. O header vale para qualquer
    # resposta, inclusive as que não passam pelo sub_filter abaixo; o meta cobre
    # o crawler que só lê o HTML.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    sub_filter_once off;
    sub_filter 'name="robots" content="index, follow, max-image-preview:large"'
               'name="robots" content="noindex, nofollow"';
    sub_filter 'Clube GeekPop & Toys — 10% de Desconto em Qualquer Produto'
               'Painel Administrativo — GeekPop & Toys';

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/shared-headers.conf;
}

# ============================================
# api.geeketoys.com.br — Express API
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.geeketoys.com.br api.geekpoptoys.com.br;

    # Lote de fotos do catálogo: 20 imagens já comprimidas (~3.5 MB cada) + folga.
    # Escopo no bloco da API — o http-level segue em 40m para os demais hosts.
    client_max_body_size 120m;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        # O painel (adm.*) reabre uma foto já salva para recortar/girar, e o
        # canvas exige que os bytes cheguem com CORS. As fotos já são públicas
        # e não há cookie envolvido, então '*' não expõe nada de novo — o
        # painel pede sem credenciais e com cache-buster, porque o que já está
        # em cache foi guardado sem este cabeçalho.
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ============================================
# radio.geeketoys.com.br — AzuraCast (painel + player web)
# Container AzuraCast escuta em 127.0.0.1:8080 no host.
# Nginx do clube roda em rede Docker separada, por isso
# usamos host.docker.internal / host-gateway para alcançar.
# Streams (Icecast/Shoutcast) NÃO passam por aqui — clientes
# conectam direto em radio.geeketoys.com.br:8000 (+range).
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name radio.geeketoys.com.br radio.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Uploads de mídia podem ser grandes
    client_max_body_size 512m;

    # Timeouts generosos pra painel que faz long-polling
    proxy_connect_timeout 60s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    # Sem buffering — painel tem streams de dados em tempo real
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://azuracast:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

