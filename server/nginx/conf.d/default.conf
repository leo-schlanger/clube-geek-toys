# ============================================
# HTTP → HTTPS redirect + ACME challenge
# ============================================
server {
    listen 80;
    server_name club.geeketoys.com.br admin.geeketoys.com.br adm.geeketoys.com.br shop.geeketoys.com.br api.geeketoys.com.br analytics.geeketoys.com.br radio.geeketoys.com.br
                club.geekpoptoys.com.br admin.geekpoptoys.com.br adm.geekpoptoys.com.br shop.geekpoptoys.com.br api.geekpoptoys.com.br analytics.geekpoptoys.com.br radio.geekpoptoys.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all for IP access (HTTP)
server {
    listen 80 default_server;
    server_name _;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================
# club.geeketoys.com.br — Member SPA
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name club.geeketoys.com.br club.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/shared-headers.conf;
}

# ============================================
# shop.geeketoys.com.br — Loja e-commerce (same cert, same build)
# Mesmo bundle Vite; getAppMode() detecta o subdomínio 'shop' em runtime.
# Fala com a API em api.geeketoys.com.br (imagens de produto em /uploads/ lá).
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name shop.geeketoys.com.br shop.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamic product sitemap from API (active catalog)
    location = /sitemap-products.xml {
        proxy_pass http://api:3001/products/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shop-specific title/description/OG for crawlers that don't run JS
    # (SPA still rewrites via SeoHead after hydration).
    # Avoid "$" in sub_filter strings — nginx treats them as variables even in quotes.
    sub_filter_once off;
    sub_filter 'Clube GeekPop & Toys — 15% de Desconto em Qualquer Produto'
               'Loja GeekPop & Toys | K-pop, Photocards e Colecionáveis no RJ';
    sub_filter 'Faça parte do Clube GeekPop & Toys! Plano único anual'
               'Loja de K-pop no Rio de Janeiro. Photocards, merch e colecionáveis com envio pelos Correios. Plano do Clube com';
    sub_filter 'Clube GeekPop & Toys — Seu Universo Geek com Vantagens'
               'Loja GeekPop & Toys | K-pop no Rio de Janeiro';
    sub_filter 'https://club.geeketoys.com.br/og-image.png'
               'https://shop.geeketoys.com.br/og-image.png';

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/shared-headers.conf;
}

# ============================================
# admin.* → adm.* (canônico)
# Motivo: alguns filtros/adblock e bookmarks quebram em subdomínio "admin";
# "adm" é o host canônico do painel. Mantém path/query no redirect.
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name admin.geeketoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://adm.geeketoys.com.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://adm.geekpoptoys.com.br$request_uri;
}

