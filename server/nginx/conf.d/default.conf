# ============================================
# api.geeketoys.com.br — Express API
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name api.geeketoys.com.br api.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# ============================================
# radio.geeketoys.com.br — AzuraCast (painel + player web)
# Container AzuraCast escuta em 127.0.0.1:8080 no host.
# Nginx do clube roda em rede Docker separada, por isso
# usamos host.docker.internal / host-gateway para alcançar.
# Streams (Icecast/Shoutcast) NÃO passam por aqui — clientes
# conectam direto em radio.geeketoys.com.br:8000 (+range).
# ============================================
server {
    listen 443 ssl;
    http2 on;
    server_name radio.geeketoys.com.br radio.geekpoptoys.com.br;

    ssl_certificate /etc/letsencrypt/live/club.geeketoys.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/club.geeketoys.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Uploads de mídia podem ser grandes
    client_max_body_size 512m;

    # Timeouts generosos pra painel que faz long-polling
    proxy_connect_timeout 60s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;

    # Sem buffering — painel tem streams de dados em tempo real
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://azuracast:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

