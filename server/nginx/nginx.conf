worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # One JSON object per line, read with `journalctl CONTAINER_NAME=clube-geek-nginx
    # -o cat | jq`. `path` is the requested path WITHOUT the query string: searches and
    # guest-order ids stay out of the log. `reqId` is the same id the API logs
    # and returns in `X-Request-Id` (passed upstream as `X-Request-Id`), so one
    # request is one id from the edge to the error row.
    # Field order matters to fail2ban (ops/fail2ban/filter.d/clube-nginx-scan.conf).
    # The path the client asked for, without the query string. Not `$uri`: that
    # is the path AFTER try_files, so every SPA request logged as /shop.html and
    # a scanner probing /wp-login.php was invisible.
    map $request_uri $request_path {
        # Regexes run in order: a CPF in the path must not reach the access log.
        "~^(?<cpf_route>/members/(?:cpf-exists|by-cpf)/)[^/?]+" ${cpf_route}:cpf;
        "~^(?<p>[^?]*)" $p;
        default $request_uri;
    }

    # ─── Content-Security-Policy (club / shop / adm) ──────────────────────────────
    #
    # É aqui que o JWT vive (localStorage), então o que mais importa é connect-src:
    # mesmo que alguém consiga injetar script, o token não sai para um host de fora.
    #
    # Sem 'unsafe-inline' em script-src — por isso o boot da SPA saiu do index.html
    # para /boot.js. Os blocos <script type="application/ld+json"> continuam inline e
    # NÃO são bloqueados: verificado no navegador contra a produção em 15/08/2026.
    # Sem 'unsafe-eval': o zod sonda `new Function("")` dentro de try/catch e cai no
    # caminho alternativo sozinho — validação do cadastro conferida com o CSP ligado.
    #
    # Cada host da lista foi tirado do código, não chutado:
    #   api.pagar.me                       tokenização do cartão no navegador
    #   js.stripe.com / api.stripe.com     legado (cobranças anteriores a 01/09/2026)
    #   challenges.cloudflare.com          Turnstile (captcha do cadastro)
    #   analytics.*                        Umami, injetado após consentimento
    #   radio.*                            now-playing + stream mp3
    #   fonts.googleapis / gstatic         Outfit + Inter (também em connect-src: o
    #                                      service worker busca o CSS com fetch, e
    #                                      sem isso a fonte sumia na 2.ª página)
    #   brasilapi / dns.google / ipify     validação de CPF, MX e IP de assinatura
    #   youtube-nocookie / instagram       embeds de vídeo do produto
    # Ao adicionar integração nova, rode scripts/qa/csp-probe.mjs antes de subir.
    map $host $csp_spa {
        default "default-src 'self'; script-src 'self' https://js.stripe.com https://challenges.cloudflare.com https://analytics.geeketoys.com.br https://analytics.geekpoptoys.com.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://radio.geeketoys.com.br https://api.geeketoys.com.br https://api.geekpoptoys.com.br; connect-src 'self' https://api.geeketoys.com.br https://api.geekpoptoys.com.br https://analytics.geeketoys.com.br https://analytics.geekpoptoys.com.br https://radio.geeketoys.com.br https://api.pagar.me https://api.stripe.com https://challenges.cloudflare.com https://brasilapi.com.br https://dns.google https://api.ipify.org https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://js.stripe.com https://challenges.cloudflare.com https://www.youtube-nocookie.com https://www.youtube.com https://www.instagram.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests";
    }

    log_format json escape=json
        '{"time":"$time_iso8601","reqId":"$request_id","ip":"$remote_addr",'
        '"host":"$host","method":"$request_method","path":"$request_path","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
        '"ref":"$http_referer","ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;

    # Nothing to gain from announcing the exact nginx build.
    server_tokens off;

    # Per-IP ceiling at the edge. The API has its own limits per route; this
    # one covers everything else (static files, uploads, the SPA shells) and
    # absorbs floods before they reach Node. Generous on purpose: a page load
    # fetches dozens of chunks and images at once, and mobile carriers put
    # many customers behind one IP (CGNAT).
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_req zone=perip burst=120 nodelay;
    limit_req_status 429;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 40m;

    # Quem monta o cartão de preview de um link sem executar JavaScript
    # (WhatsApp, Instagram/Facebook, iMessage, Telegram…). Recebem um HTML curto
    # da API com as tags de cada página — ver conf.d/default.conf, bloco shop.
    #
    # Buscadores (Googlebot, bingbot, Applebot) ficam de FORA de propósito: eles
    # renderizam a SPA, que tem o conteúdo inteiro e os dados estruturados. O
    # stub para eles era página rasa com meta refresh apontando para ela mesma.
    #
    # Nomes de robô, não de app: "Telegram" e "Pinterest" sozinhos pegavam o
    # navegador embutido desses apps, e a pessoa caía no stub.
    map $http_user_agent $is_link_crawler {
        default 0;
        "~*(facebookexternalhit|facebookcatalog|WhatsApp|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|Pinterestbot|redditbot|SkypeUriPreview|vkShare|Viber|Snapchat|Iframely|Embedly|Bluesky|Mastodon|Google-PageRenderer)" 1;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
